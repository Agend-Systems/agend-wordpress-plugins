name: Tests

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # The plugins declare "Requires PHP: 7.4", so the syntax check runs on the
    # oldest supported runtime as well as a current one.
    name: Syntax check (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: php -l every plugin file
        run: |
          set -o pipefail
          find agend-* -name '*.php' -not -path '*/vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l \
            | { grep -v 'No syntax errors' || true; } \
            | tee /tmp/lint.txt
          test ! -s /tmp/lint.txt

  phpunit:
    # The suite itself needs PHP 8.1 (attributes; composer.json requires >=8.1).
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - name: Install test dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPUnit
        run: ./vendor/bin/phpunit

  blocks:
    # Build output under agend-apps-core/build/ is committed because deploys copy
    # files without a build step; this proves the committed output is current.
    name: Block build matches source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Committed build is up to date
        run: |
          git add -N agend-apps-core/build
          git diff --exit-code --stat -- agend-apps-core/build \
            || { echo '::error::agend-apps-core/build is stale: run `npm run build` and commit the result'; exit 1; }

  versions:
    # Guardrail for the release workflow (.github/workflows/release.yml):
    # every plugin's header Version must be valid semver and must match its
    # own *_VERSION constant (where one is defined), so a release never gets
    # cut from an inconsistent header.
    name: Plugin version headers are consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Header/constant/semver check
        run: .github/scripts/detect-releases.sh --check-only
