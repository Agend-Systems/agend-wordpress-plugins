name: Tests

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # The plugins declare "Requires PHP: 7.4", so the syntax check runs on the
    # oldest supported runtime as well as a current one.
    name: Syntax check (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: php -l every plugin file
        run: |
          set -o pipefail
          find agend-* -name '*.php' -not -path '*/vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l \
            | { grep -v 'No syntax errors' || true; } \
            | tee /tmp/lint.txt
          test ! -s /tmp/lint.txt

  phpunit:
    # The suite itself needs PHP 8.1 (attributes; composer.json requires >=8.1).
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - name: Install test dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPUnit
        run: ./vendor/bin/phpunit
